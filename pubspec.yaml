name: construction_monitor_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.5.0
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  pdfrx: ^2.5.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  http: ^1.5.0
  lucide_icons_flutter: ^3.1.19

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  # Tasarim fontlari projeye gomulu - calisma aninda internetten indirilmez,
  # uygulama cevrimdisi acildiginda da dogru yazi tipiyle acilir.
  fonts:
    # Basliklar ve rakamlar: sikistirilmis, yuksek kontrastli
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
          weight: 400
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    # Govde metni: uzun okumada yorulmayan, rakamlari net
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600

