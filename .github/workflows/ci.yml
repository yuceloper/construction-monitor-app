name: CI Flutter

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Compile web
        run: flutter build web --release --base-href / --dart-define=API_BASE_URL=http://127.0.0.1:18080/api/v1

  deploy-staging:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    needs: verify
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
